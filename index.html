<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050b14">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARYAN CHEATS</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #050b14;
    --card: #0d1b2a;
    --text: #00ffcc;
    --muted: #8ab4f8;
    --border: rgba(0,255,204,0.2);
}

body.light {
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: rgba(0,0,0,0.15);
}

body {
    font-family: 'Courier New', Courier, monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 25px 15px;
    transition: 0.4s;
    overflow-x: hidden;
    position: relative;
}

/* Hacker Cyber Grid Background */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: 
        linear-gradient(rgba(0, 255, 204, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 204, 0.03) 1px, transparent 1px);
    background-size: 30px 30px;
    z-index: -2;
    pointer-events: none;
}

/* Animated Hacker Glow Orbs */
body::after {
    content: "";
    position: fixed;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: rgba(0, 255, 204, 0.15);
    filter: blur(130px);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: hackerPulse 6s infinite alternate;
    z-index: -1;
    pointer-events: none;
}

@keyframes hackerPulse {
    0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.2; }
    100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.4; }
}

/* Floating Animated Watermark */
.watermark {
    position: fixed;
    bottom: 15px;
    right: 20px;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 3px;
    color: rgba(0, 255, 204, 0.25);
    animation: watermarkGlow 3s infinite alternate;
    z-index: 99;
    pointer-events: none;
    text-transform: uppercase;
}

@keyframes watermarkGlow {
    0% { opacity: 0.2; text-shadow: 0 0 5px rgba(0,255,204,0); }
    100% { opacity: 0.7; text-shadow: 0 0 15px rgba(0,255,204,0.8); }
}

/* Centered Profile Header */
.profile-header {
    max-width: 850px;
    margin: 0 auto 30px;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 30px rgba(0, 255, 204, 0.1);
    position: relative;
}

.profile-img-box {
    width: 90px;
    height: 90px;
    margin: 0 auto 15px;
    border-radius: 50%;
    border: 2px solid #00ffcc;
    overflow: hidden;
    box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
    animation: imgFloat 4s ease-in-out infinite;
}

.profile-img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

@keyframes imgFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}

.logo {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #00ffcc;
    margin-bottom: 5px;
    text-shadow: 0 0 10px rgba(0,255,204,0.5);
}

.sub-title {
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 1px;
}

/* Sliding Theme Toggle Switch */
.theme-switch-wrapper {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    align-items: center;
}

.theme-switch {
    position: relative;
    display: inline-block;
    width: 54px;
    height: 28px;
}

.theme-switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider-toggle {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background-color: #1e293b;
    border: 1px solid var(--border);
    transition: 0.4s;
    border-radius: 34px;
}

.slider-toggle:before {
    position: absolute;
    content: "🌙";
    height: 20px;
    width: 20px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: 0.4s;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 10px;
}

input:checked + .slider-toggle {
    background-color: #00ffcc;
}

input:checked + .slider-toggle:before {
    transform: translateX(26px);
    content: "☀️";
}

/* Main Container */
.container {
    max-width: 850px;
    margin: auto;
}

/* Subject Tabs */
.subject-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 22px;
}

.tab-btn {
    padding: 15px 5px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.tab-btn.active {
    background: #00ffcc;
    color: #050b14;
    border-color: #00ffcc;
    box-shadow: 0 0 15px rgba(0,255,204,0.4);
    transform: translateY(-3px);
}

.tab-btn:hover {
    transform: translateY(-3px);
}

/* Subject Pages */
.subject {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.subject.active {
    display: block;
    animation: pageOpen 0.4s ease;
}

@keyframes pageOpen {
    from {
        opacity: 0;
        transform: translateY(18px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.subject-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.subject-header h2 {
    font-size: 20px;
}

.subject-count {
    color: var(--muted);
    font-size: 13px;
}

/* Chapters */
.chapter {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
}

.chapter:last-child {
    border-bottom: none;
}

.chapter-name {
    font-size: 15px;
    line-height: 1.5;
}

.chapter.done .chapter-name {
    color: #00ffcc;
    text-shadow: 0 0 8px rgba(0,255,204,0.4);
}

/* Checkbox Switch */
.switch {
    position: relative;
    width: 58px;
    height: 30px;
    flex-shrink: 0;
}

.switch input {
    display: none;
}

.slider {
    position: absolute;
    inset: 0;
    background: #ef4444;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.3s;
}

.slider::before {
    content: "❌";
    position: absolute;
    width: 24px;
    height: 24px;
    left: 3px;
    top: 3px;
    background: white;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 12px;
    transition: 0.3s;
}

.switch input:checked + .slider {
    background: #00ffcc;
}

.switch input:checked + .slider::before {
    content: "✓";
    color: #050b14;
    transform: translateX(28px);
    font-weight: bold;
}

/* Footer */
footer {
    text-align: center;
    color: var(--muted);
    padding: 30px 0;
    font-size: 13px;
}

/* Mobile Responsive */
@media(max-width: 500px) {
    .logo {
        font-size: 20px;
    }
    .profile-header {
        padding: 20px 10px;
    }
    .subject {
        padding: 16px;
    }
    .subject-header h2 {
        font-size: 17px;
    }
    .tab-btn {
        font-size: 11px;
        padding: 12px 2px;
    }
    .chapter-name {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<!-- Floating Watermark -->
<div class="watermark">AS ARYAN</div>

<!-- Centered Profile Header with Logo -->
<header class="profile-header">
    <div class="theme-switch-wrapper">
        <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" onclick="changeTheme()" />
            <div class="slider-toggle"></div>
        </label>
    </div>

    <div class="profile-img-box">
        <!-- User Provided Skull Logo Image -->
        <img src="IMG_e6497cef-fefd-43ac-b220-004a72be81eb.jpg-removebg-preview" alt="Aryan Logo">
    </div>

    <div class="logo">⚡ ARYAN CHEATS ⚡</div>
    <p class="sub-title">Play freely. Play more.</p>
</header>


<main class="container">
    <!-- SUBJECT BUTTONS -->
    <nav class="subject-tabs" id="subjectTabs"></nav>

    <!-- SUBJECT PAGES -->
    <div id="subjects"></div>
</main>


<footer>
    ARYAN CHEATS © 2026 | Keep Playing 🚀
</footer>


<script>
// SUBJECT DATA
const subjects = [
{
    name: "AIMBOT",
    icon: "☠️",
    chapters: [
        "Autoaim",
        "Aim lock",
        "Aim head",
        "No Recoil",
        "Body headshot",
    ]
},
{
    name: "SNIPER",
    icon: "◎",
    chapters: [
        "sniper scope",
        "sniper aim",
        "sniper switch",
        "sniper aimbot",
        "sniper glitch",
    ]
},
{
    name: "LOCATION",
    icon: "📍",
    chapters: [
        "Chams menu",
        "Esp infomation",
        "Esp skeleton",
        "Esp box",
        "Esp line",
    ]
},
{
    name: "BYPASS",
    icon: "🖥️",
    chapters: [],
    other: true
}
];

// LOAD SAVED PROGRESS
let saved = {};
try {
    saved = JSON.parse(localStorage.getItem("aryanCheatProgress") || "{}");
} catch(error) {
    saved = {};
}

// CREATE SUBJECT PAGES
function createSubjects() {
    const container = document.getElementById("subjects");
    const tabs = document.getElementById("subjectTabs");

    container.innerHTML = "";
    tabs.innerHTML = "";

    subjects.forEach((subject, index) => {
        // CREATE BUTTON
        const btn = document.createElement("button");
        btn.className = "tab-btn";
        btn.textContent = subject.icon + " " + subject.name;
        btn.onclick = function() {
            showSubject(index);
        };
        tabs.appendChild(btn);

        // CREATE PAGE
        const card = document.createElement("section");
        card.className = "subject";
        card.id = "subject-" + index;

        // OTHER PAGE SECTION
        if(subject.other) {
            const header = document.createElement("div");
            header.className = "subject-header";
            header.innerHTML = "<h2>🖥️ OTHER TOOLS</h2>";
            card.appendChild(header);

            const otherTasks = [
                "PC BYPASS",
                "Screen Freeze",
                "Network (ON/OFF)",
            ];

            otherTasks.forEach((task, taskIndex) => {
                const key = "other-" + taskIndex;
                const isDone = saved[key] === true;

                const row = document.createElement("div");
                row.className = "chapter" + (isDone ? " done" : "");

                const name = document.createElement("span");
                name.className = "chapter-name";
                name.textContent = task;

                const label = document.createElement("label");
                label.className = "switch";

                const input = document.createElement("input");
                input.type = "checkbox";
                input.checked = isDone;
                input.onchange = function() {
                    toggleChapter(key, this);
                };

                const slider = document.createElement("span");
                slider.className = "slider";

                label.appendChild(input);
                label.appendChild(slider);
                row.appendChild(name);
                row.appendChild(label);
                card.appendChild(row);
            });

            container.appendChild(card);
            return;
        }

        // SUBJECT HEADING
        const header = document.createElement("div");
        header.className = "subject-header";
        header.innerHTML = `
            <h2>${subject.icon} ${subject.name}</h2>
            <span class="subject-count" id="count-${index}">0 / ${subject.chapters.length}</span>
        `;
        card.appendChild(header);

        // CREATE CHAPTERS
        subject.chapters.forEach((chapter, chapterIndex) => {
            const key = index + "-" + chapterIndex;
            const isDone = saved[key] === true;

            const row = document.createElement("div");
            row.className = "chapter" + (isDone ? " done" : "");

            const name = document.createElement("span");
            name.className = "chapter-name";
            name.textContent = chapter;

            const label = document.createElement("label");
            label.className = "switch";

            const input = document.createElement("input");
            input.type = "checkbox";
            input.checked = isDone;
            input.onchange = function() {
                toggleChapter(key, this);
            };

            const slider = document.createElement("span");
            slider.className = "slider";

            label.appendChild(input);
            label.appendChild(slider);
            row.appendChild(name);
            row.appendChild(label);
            card.appendChild(row);
        });

        container.appendChild(card);
    });

    showSubject(0);
    updateSubjectCounts();
}

// SWITCH SUBJECT PAGE
function showSubject(index) {
    document.querySelectorAll(".subject").forEach(card => {
        card.classList.remove("active");
    });
    document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.remove("active");
    });

    document.getElementById("subject-" + index).classList.add("active");
    document.querySelectorAll(".tab-btn")[index].classList.add("active");
}

// CHAPTER TOGGLE
function toggleChapter(key, input) {
    saved[key] = input.checked;
    localStorage.setItem("aryanCheatProgress", JSON.stringify(saved));
    input.closest(".chapter").classList.toggle("done", input.checked);
    updateSubjectCounts();
}

// SUBJECT COUNTS
function updateSubjectCounts() {
    subjects.forEach((subject, index) => {
        if(subject.other) return;

        let completed = 0;
        subject.chapters.forEach((chapter, chapterIndex) => {
            const key = index + "-" + chapterIndex;
            if(saved[key] === true) {
                completed++;
            }
        });

        document.getElementById("count-" + index).textContent = completed + " / " + subject.chapters.length;
    });
}

// DARK / LIGHT MODE
function changeTheme() {
    document.body.classList.toggle("light");
    const isLight = document.body.classList.contains("light");
    localStorage.setItem("aryanCheatTheme", isLight ? "light" : "dark");
}

// RESTORE THEME
if(localStorage.getItem("aryanCheatTheme") === "light") {
    document.body.classList.add("light");
    document.getElementById("checkbox").checked = true;
}

// START APP
createSubjects();
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log('Service Worker Registered Successfully'));
  }
</script>

</body>
</html>
