<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background 0.3s;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Profile Card Styling */
        .profile-card {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
            position: relative; /* Top right switch ke liye */
            transition: all 0.3s;
        }

        .avatar {
            font-size: 50px;
            background-color: #bae6fd;
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            margin: 10px auto 15px auto;
        }

        h1 {
            color: #0369a1;
            margin-bottom: 5px;
        }

        p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .connect-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
            transition: background-color 0.3s;
        }

        .connect-btn:hover {
            background-color: #0369a1;
        }

        /* --- Top Right Toggle Switch CSS --- */
        .theme-switch-wrapper {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            align-items: center;
        }

        .theme-switch {
            display: inline-block;
            height: 24px;
            position: relative;
            width: 46px;
        }

        .theme-switch input {
            display: none;
        }

        .slider {
            background-color: #ccc;
            bottom: 0;
            cursor: pointer;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            background-color: #fff;
            bottom: 3px;
            content: "☀️";
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 18px;
            left: 3px;
            position: absolute;
            transition: .4s;
            width: 18px;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #0284c7;
        }

        input:checked + .slider:before {
            transform: translateX(22px);
            content: "🌙";
        }

        /* --- DARK MODE STYLING --- */
        body.dark-mode {
            background: #0f172a;
        }

        body.dark-mode .profile-card {
            background-color: #1e293b;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        body.dark-mode h1 {
            color: #38bdf8;
        }

        body.dark-mode p {
            color: #94a3b8;
        }

        body.dark-mode .avatar {
            background-color: #0f172a;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- Top Right Switch -->
        <div class="theme-switch-wrapper">
            <label class="theme-switch" for="checkbox">
                <input type="checkbox" id="checkbox" />
                <div class="slider"></div>
            </label>
        </div>

        <div class="avatar">👨‍💻</div>
        <h1>Aryan</h1>
        <p>Panel and bypass in Training 🚀</p>
        
        <!-- Telegram Link Button -->
        <a href="https://t.me/tbhelp1bot" target="_blank" id="connect-btn" class="connect-btn">Connect Karo</a>
    </div>

    <script>
        // 1. Dark Mode Toggle Switch Logic
        const toggleSwitch = document.querySelector('#checkbox');
        const body = document.body;

        toggleSwitch.addEventListener('change', function(e) {
            if (e.target.checked) {
                body.classList.add('dark-mode');
            } else {
                body.classList.remove('dark-mode');
            }
        });

        // 2. Telegram Link Click Handling
        const connectBtn = document.getElementById('connect-btn');

        connectBtn.addEventListener('click', function() {
            // User click karke Telegram par jayega aur button badal jayega
            connectBtn.innerText = "✅ Connected!";
            connectBtn.style.backgroundColor = "#10b981";
        });
    </script>

</body>
</html>
