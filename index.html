<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARYAN CHEAT - Cyber Panel</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #090d16;
    --card: #111a2e;
    --text: #00ffcc;
    --text-main: #ffffff;
    --muted: #788ca6;
    --border: rgba(0, 255, 204, 0.2);
    --primary: #167b5c;
    --accent: #00ffcc;
}

body.light {
    --bg: #edf2fa;
    --card: #ffffff;
    --text: #172337;
    --text-main: #172337;
    --muted: #64748b;
    --border: rgba(0,0,0,0.1);
    --accent: #167b5c;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg);
    color: var(--text-main);
    min-height: 100vh;
    padding: 25px 15px;
    transition: 0.4s;
    overflow-x: hidden;
    position: relative;
}

/* Cyber Hacker Animated Background */
.matrix-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: 
        linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 204, 0.03) 3px, rgba(0, 255, 204, 0.03) 3px);
    background-size: 100% 100%, 100% 4px;
    z-index: -2;
    pointer-events: none;
}

body::before,
body::after {
    content: "";
    position: fixed;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.2;
    z-index: -1;
    pointer-events: none;
}

body::before {
    background: #00ffcc;
    top: -100px;
    left: -100px;
    animation: move1 9s infinite alternate;
}

body::after {
    background: #7928ca;
    bottom: -100px;
    right: -100px;
    animation: move2 8s infinite alternate;
}

@keyframes move1 {
    to { transform: translate(150px,100px); }
}

@keyframes move2 {
    to { transform: translate(-120px,-100px); }
}

/* Profile Header Section (Centered) */
.profile-header {
    max-width: 850px;
    margin: 0 auto 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
}

.theme-btn-top {
    position: absolute;
    top: 0;
    right: 0;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.3s;
    box-shadow: 0 0 10px rgba(0, 255, 204, 0.1);
}

.theme-btn-top:hover {
    transform: scale(1.1);
    border-color: var(--accent);
}

.avatar-wrapper {
    position: relative;
    margin-bottom: 12px;
}

.avatar {
    width: 95px;
    height: 95px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00ffcc, #7928ca);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: bold;
    color: #fff;
    border: 3px solid var(--accent);
    box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
    animation: pulseGlow 3s infinite alternate;
}

@keyframes pulseGlow {
    from { box-shadow: 0 0 15px rgba(0, 255, 204, 0.3); }
    to { box-shadow: 0 0 28px rgba(0, 255, 204, 0.7); }
}

.logo-title {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--text-main);
    text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
    margin-bottom: 4px;
}

.tagline {
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 1px;
}

/* Main Container */
.container {
    max-width: 850px;
    margin: auto;
}

/* Subject Tabs */
.subject-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 22px;
}

.tab-btn {
    padding: 14px 5px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card);
    color: var(--text-main);
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.tab-btn.active {
    background: var(--primary);
    color: white;
    border-color: #20c997;
    box-shadow: 0 0 15px rgba(32, 201, 151, 0.4);
    transform: translateY(-3px);
}

.tab-btn:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
}

/* Subject Pages */
.subject {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.subject.active {
    display: block;
    animation: pageOpen 0.4s ease;
}

@keyframes pageOpen {
    from {
        opacity: 0;
        transform: translateY(18px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.subject-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.subject-header h2 {
    font-size: 20px;
    color: var(--accent);
}

.subject-count {
    color: var(--muted);
    font-size: 13px;
}

/* Chapters */
.chapter {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
}

.chapter:last-child {
    border-bottom: none;
}

.chapter-name {
    font-size: 15px;
    line-height: 1.5;
}

.chapter.done .chapter-name {
    color: #20c997;
    text-shadow: 0 0 8px rgba(32, 201, 151, 0.3);
}

/* Toggle Switch */
.switch {
    position: relative;
    width: 58px;
    height: 30px;
    flex-shrink: 0;
}

.switch input {
    display: none;
}

.slider {
    position: absolute;
    inset: 0;
    background: #e74c3c;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.3s;
}

.slider::before {
    content: "❌";
    position: absolute;
    width: 24px;
    height: 24px;
    left: 3px;
    top: 3px;
    background: white;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 12px;
    transition: 0.3s;
}

.switch input:checked + .slider {
    background: #16b981;
}

.switch input:checked + .slider::before {
    content: "✓";
    color: #16a34a;
    transform: translateX(28px);
    font-weight: bold;
}

/* Watermark Animation */
.watermark {
    position: fixed;
    bottom: 15px;
    right: 20px;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 2px;
    color: rgba(0, 255, 204, 0.35);
    pointer-events: none;
    z-index: 100;
    text-transform: uppercase;
    animation: watermarkFloat 4s ease-in-out infinite alternate;
}

@keyframes watermarkFloat {
    0% {
        transform: translateY(0) scale(1);
        opacity: 0.3;
        text-shadow: 0 0 5px rgba(0, 255, 204, 0.2);
    }
    100% {
        transform: translateY(-6px) scale(1.05);
        opacity: 0.7;
        text-shadow: 0 0 12px rgba(0, 255, 204, 0.8);
    }
}

/* Footer */
footer {
    text-align: center;
    color: var(--muted);
    padding: 30px 0 10px;
    font-size: 13px;
}

/* Mobile responsive */
@media(max-width: 500px) {
    .logo-title {
        font-size: 22px;
    }
    .avatar {
        width: 80px;
        height: 80px;
        font-size: 35px;
    }
    .subject {
        padding: 16px;
    }
    .subject-header h2 {
        font-size: 18px;
    }
    .tab-btn {
        font-size: 11px;
        padding: 12px 2px;
    }
    .chapter-name {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="matrix-bg"></div>

<!-- Watermark -->
<div class="watermark">AS ARYAN</div>

<!-- CENTERED PROFILE HEADER -->
<header class="profile-header">
    <button class="theme-btn-top" id="themeBtn" onclick="changeTheme()">🌙</button>

    <div class="avatar-wrapper">
        <div class="avatar">⚡</div>
    </div>
    
    <h1 class="logo-title">ARYAN CHEATS</h1>
    <p class="tagline">Play freely • Play more 🎯</p>
</header>

<main class="container">
    <!-- SUBJECT BUTTONS -->
    <nav class="subject-tabs" id="subjectTabs"></nav>

    <!-- SUBJECT PAGES -->
    <div id="subjects"></div>
</main>

<footer>
    ARYAN CHEATS © 2026 | Keep Playing 🚀
</footer>

<script>
// SUBJECT DATA
const subjects = [
    {
        name: "AIMBOT",
        icon: "☠️",
        chapters: [
            "Autoaim",
            "Aim lock",
            "Aim head",
            "No Recoil",
            "Body headshot"
        ]
    },
    {
        name: "SNIPER",
        icon: "◎",
        chapters: [
            "sniper scope",
            "sniper aim",
            "sniper switch",
            "sniper aimbot",
            "sniper glitch"
        ]
    },
    {
        name: "LOCATION",
        icon: "📍",
        chapters: [
            "Chams menu",
            "Esp infomation",
            "Esp skeleton",
            "Esp box",
            "Esp line"
        ]
    },
    {
        name: "BYPASS",
        icon: "🖥️",
        chapters: [],
        other: true
    }
];

// LOAD SAVED CHAPTERS
let saved = {};
try {
    saved = JSON.parse(localStorage.getItem("cheatProgress") || "{}");
} catch(error) {
    saved = {};
}

// CREATE SUBJECT PAGES
function createSubjects() {
    const container = document.getElementById("subjects");
    const tabs = document.getElementById("subjectTabs");

    container.innerHTML = "";
    tabs.innerHTML = "";

    subjects.forEach((subject, index) => {
        // CREATE BUTTON
        const btn = document.createElement("button");
        btn.className = "tab-btn";
        btn.textContent = subject.icon + " " + subject.name;
        btn.onclick = function() {
            showSubject(index);
        };
        tabs.appendChild(btn);

        // CREATE PAGE
        const card = document.createElement("section");
        card.className = "subject";
        card.id = "subject-" + index;

        // OTHER PAGE
        if(subject.other) {
            const header = document.createElement("div");
            header.className = "subject-header";
            header.innerHTML = "<h2>🖥️ OTHER / BYPASS</h2>";
            card.appendChild(header);

            const otherTasks = [
                "PC BYPASS",
                "Screen Freeze",
                "Network (ON/OFF)"
            ];

            otherTasks.forEach((task, taskIndex) => {
                const key = "other-" + taskIndex;
                const isDone = saved[key] === true;

                const row = document.createElement("div");
                row.className = "chapter" + (isDone ? " done" : "");

                const name = document.createElement("span");
                name.className = "chapter-name";
                name.textContent = task;

                const label = document.createElement("label");
                label.className = "switch";

                const input = document.createElement("input");
                input.type = "checkbox";
                input.checked = isDone;

                input.onchange = function() {
                    toggleChapter(key, this);
                };

                const slider = document.createElement("span");
                slider.className = "slider";

                label.appendChild(input);
                label.appendChild(slider);

                row.appendChild(name);
                row.appendChild(label);

                card.appendChild(row);
            });

            container.appendChild(card);
            return;
        }

        // SUBJECT HEADING
        const header = document.createElement("div");
        header.className = "subject-header";
        header.innerHTML = `
            <h2>${subject.icon} ${subject.name}</h2>
            <span class="subject-count" id="count-${index}">
                0 / ${subject.chapters.length}
            </span>
        `;
        card.appendChild(header);

        // CREATE CHAPTERS
        subject.chapters.forEach((chapter, chapterIndex) => {
            const key = index + "-" + chapterIndex;
            const isDone = saved[key] === true;

            const row = document.createElement("div");
            row.className = "chapter" + (isDone ? " done" : "");

            const name = document.createElement("span");
            name.className = "chapter-name";
            name.textContent = chapter;

            const label = document.createElement("label");
            label.className = "switch";

            const input = document.createElement("input");
            input.type = "checkbox";
            input.checked = isDone;

            input.onchange = function() {
                toggleChapter(key, this);
            };

            const slider = document.createElement("span");
            slider.className = "slider";

            label.appendChild(input);
            label.appendChild(slider);

            row.appendChild(name);
            row.appendChild(label);

            card.appendChild(row);
        });

        container.appendChild(card);
    });

    showSubject(0);
    updateSubjectCounts();
}

// SWITCH SUBJECT PAGE
function showSubject(index) {
    document.querySelectorAll(".subject").forEach(card => card.classList.remove("active"));
    document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));

    document.getElementById("subject-" + index).classList.add("active");
    document.querySelectorAll(".tab-btn")[index].classList.add("active");
}

// CHAPTER TOGGLE
function toggleChapter(key, input) {
    saved[key] = input.checked;
    localStorage.setItem("cheatProgress", JSON.stringify(saved));

    input.closest(".chapter").classList.toggle("done", input.checked);
    updateSubjectCounts();
}

// SUBJECT COUNTS
function updateSubjectCounts() {
    subjects.forEach((subject, index) => {
        if(subject.other) return;

        let completed = 0;
        subject.chapters.forEach((chapter, chapterIndex) => {
            const key = index + "-" + chapterIndex;
            if(saved[key] === true) completed++;
        });

        document.getElementById("count-" + index).textContent =
            completed + " / " + subject.chapters.length;
    });
}

// DARK / LIGHT MODE
function changeTheme() {
    document.body.classList.toggle("light");
    const isLight = document.body.classList.contains("light");

    document.getElementById("themeBtn").textContent = isLight ? "☀️" : "🌙";
    localStorage.setItem("cheatTheme", isLight ? "light" : "dark");
}

// RESTORE THEME
if(localStorage.getItem("cheatTheme") === "light") {
    document.body.classList.add("light");
    document.getElementById("themeBtn").textContent = "☀️";
}

// START APP
createSubjects();
</script>

</body>
</html>
